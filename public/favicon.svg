<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Fondo oscuro redondeado, igual al bg del app -->
  <rect width="32" height="32" rx="7" fill="#0b0b14"/>

  <!-- Brillo sutil en la esquina superior izquierda -->
  <radialGradient id="glow" cx="30%" cy="25%" r="55%">
    <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="#0b0b14" stop-opacity="0"/>
  </radialGradient>
  <rect width="32" height="32" rx="7" fill="url(#glow)"/>

  <!-- Copa martini — borde ámbar -->
  <g stroke="#f59e0b" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Borde superior de la copa -->
    <line x1="5"  y1="7"  x2="27" y2="7"  stroke-width="2.2"/>
    <!-- Lado izquierdo hasta el vértice -->
    <line x1="5"  y1="7"  x2="16" y2="19" stroke-width="2.2"/>
    <!-- Lado derecho hasta el vértice -->
    <line x1="27" y1="7"  x2="16" y2="19" stroke-width="2.2"/>
    <!-- Tallo -->
    <line x1="16" y1="19" x2="16" y2="25" stroke-width="2.2"/>
    <!-- Base -->
    <line x1="11" y1="25" x2="21" y2="25" stroke-width="2.5"/>
  </g>

  <!-- Líquido ámbar semitransparente dentro de la copa -->
  <path d="M6.5 9 L25.5 9 L16 19 Z" fill="#f59e0b" opacity="0.20"/>

  <!-- Adorno: oliva / cereza en morado sobre la copa -->
  <line x1="22.5" y1="5"   x2="22.5" y2="10" stroke="#f59e0b" stroke-width="1.1" stroke-linecap="round"/>
  <circle cx="22.5" cy="7" r="2.2" fill="#a855f7"/>
  <circle cx="22.5" cy="7" r="0.9" fill="#7c3aed"/>
</svg>
